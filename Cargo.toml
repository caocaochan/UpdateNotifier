[package]
name = "update-notifier"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.1", features = ["gzip", "json", "platform-verifier", "rustls"], default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Power"] }
